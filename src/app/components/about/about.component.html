<section class="section">
  <div class="container">
    <h2 class="text-3xl font-bold text-center mb-12">About Me</h2>

    <div class="grid md:grid-cols-2 gap-12">
      <!-- Bio Section -->
      <div>
        <h3 class="text-2xl font-semibold mb-4">Who I Am</h3>
        <p class="text-gray-600 mb-8">{{ bio }}</p>
      </div>

      <!-- Skills Section -->
      <div>
        <h3 class="text-2xl font-semibold mb-4">Skills</h3>
        <div class="space-y-6">
          <div>
            <h4 class="text-lg font-medium mb-2">Languages</h4>
            <div class="flex flex-wrap gap-2">
              <span
                *ngFor="let skill of skills.languages"
                class="px-3 py-1 bg-primary text-white rounded-full text-sm"
              >
                {{ skill }}
              </span>
            </div>
          </div>
          <div>
            <h4 class="text-lg font-medium mb-2">Frameworks</h4>
            <div class="flex flex-wrap gap-2">
              <span
                *ngFor="let skill of skills.frameworks"
                class="px-3 py-1 bg-primary text-white rounded-full text-sm"
              >
                {{ skill }}
              </span>
            </div>
          </div>
          <div>
            <h4 class="text-lg font-medium mb-2">Tools</h4>
            <div class="flex flex-wrap gap-2">
              <span
                *ngFor="let skill of skills.tools"
                class="px-3 py-1 bg-primary text-white rounded-full text-sm"
              >
                {{ skill }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Experience Section -->
    <div class="mt-12">
      <h3 class="text-2xl font-semibold mb-8">Experience</h3>
      <div class="space-y-8">
        <div
          *ngFor="let exp of experience"
          class="bg-white p-6 rounded-lg shadow-md"
        >
          <div class="flex justify-between items-start">
            <div>
              <h4 class="text-xl font-medium">{{ exp.title }}</h4>
              <p class="text-primary">{{ exp.company }}</p>
            </div>
            <span class="text-gray-500">{{ exp.period }}</span>
          </div>
          <p class="mt-4 text-gray-600">{{ exp.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
