<section
  class="min-h-screen flex items-center justify-center bg-gradient-to-b from-light to-light/50 pt-16 dark:from-dark-lighter dark:to-dark-lighter/50"
>
  <div class="container mx-auto px-4">
    <div class="flex flex-col md:flex-row items-center justify-between gap-8">
      <div class="md:w-1/2 text-center md:text-left">
        <h1
          class="text-4xl md:text-6xl font-bold text-dark dark:text-light mb-4"
        >
          {{ name }}
        </h1>
        <h2 class="text-2xl md:text-3xl text-primary mb-6">{{ role }}</h2>
        <p class="text-lg text-gray-600 dark:text-gray-300 mb-8">{{ bio }}</p>
        <div class="flex justify-center md:justify-start space-x-4">
          <a
            [href]="socialLinks.github"
            target="_blank"
            class="btn btn-primary"
          >
            <i class="fab fa-github mr-2"></i>GitHub
          </a>
          <a
            [href]="socialLinks.linkedin"
            target="_blank"
            class="btn btn-primary"
          >
            <i class="fab fa-linkedin mr-2"></i>LinkedIn
          </a>
        </div>
      </div>
      <div class="md:w-1/2">
        <img
          src="../../../assets/images/profile.jpg"
          alt="Profile"
          class="rounded-full w-64 h-64 md:w-80 md:h-80 object-cover mx-auto shadow-xl"
        />
      </div>
    </div>
  </div>
</section>
