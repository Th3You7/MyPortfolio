<section class="section">
  <div class="container">
    <h2 class="text-3xl font-bold text-center mb-12">My Projects</h2>

    <!-- Technology Filter -->
    <div class="flex flex-wrap justify-center gap-2 mb-12">
      @for (tech of technologies; track tech) {
      <button
        (click)="filterProjects(tech)"
        [class.bg-primary]="selectedTechnology === tech"
        [class.text-white]="selectedTechnology === tech"
        class="px-4 py-2 rounded-full border border-primary text-primary hover:bg-primary hover:text-white transition-colors duration-200"
      >
        {{ tech }}
      </button>
      }
    </div>

    <!-- Projects Grid -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (project of filteredProjects; track project) {
      <div class="bg-white rounded-lg shadow-md overflow-hidden">
        <img
          [src]="project.imageUrl"
          [alt]="project.title"
          class="w-full h-48 object-cover"
        />
        <div class="p-6">
          <h3 class="text-xl font-semibold mb-2">{{ project.title }}</h3>
          <p class="text-gray-600 mb-4">{{ project.description }}</p>

          <!-- Technologies -->
          <div class="flex flex-wrap gap-2 mb-4">
            @for (tech of project.technologies; track tech) {
            <span
              class="px-2 py-1 bg-gray-100 text-gray-700 rounded-full text-xs"
            >
              {{ tech }}
            </span>
            }
          </div>

          <!-- Links -->
          <div class="flex space-x-4">
            <a
              [href]="project.githubUrl"
              target="_blank"
              class="text-primary hover:text-secondary"
            >
              <i class="fab fa-github"></i> GitHub
            </a>
            @if (project.demoUrl) {
            <a
              [href]="project.demoUrl"
              target="_blank"
              class="text-primary hover:text-secondary"
            >
              <i class="fas fa-external-link-alt"></i> Live Demo
            </a>
            }
          </div>
        </div>
      </div>
      }
    </div>
  </div>
</section>
